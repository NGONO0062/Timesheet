# Environnement de staging : tout TimeSheet sur un seul serveur Linux.
# Application, PostgreSQL, HTTPS (Caddy) et tâches planifiées. Guide : docs/staging.md.
# Les valeurs viennent de deploy/staging/.env (modèle : .env.example, à côté).
name: timesheet-staging

x-base: &base
  DATABASE_URL: postgresql://timesheet:${POSTGRES_PASSWORD:?}@db:5432/timesheet?schema=public
  APP_URL: https://${DOMAIN:?}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: timesheet
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet -d timesheet"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ../..
    image: timesheet:staging
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *base
      STORAGE_DIR: /app/storage
      # Sinon le serveur Next n'écoute que sur le nom du conteneur.
      HOSTNAME: 0.0.0.0
    volumes:
      - pdf-data:/app/storage
    depends_on:
      db:
        condition: service_healthy

  # Mise en service (migrations, admin plateforme, données de démonstration) :
  # étape « build » de l'image, qui a la CLI Prisma. Lancé à la demande seulement :
  #   docker compose run --rm outils npx prisma migrate deploy
  outils:
    build:
      context: ../..
      target: build
    image: timesheet:staging-outils
    profiles: [outils]
    env_file: .env
    environment:
      <<: *base
    depends_on:
      db:
        condition: service_healthy

  # HTTPS : certificat Let's Encrypt obtenu et renouvelé tout seul pour DOMAIN.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Tâches planifiées (docs/exploitation.md) : relances et rappels de saisie.
  taches:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      TASKS_SECRET: ${TASKS_SECRET:?}
    volumes:
      - ./taches.crontab:/etc/crontabs/root:ro
    command: ["crond", "-f", "-l", "6"]
    depends_on:
      - app

volumes:
  db-data:
  pdf-data:
  caddy-data:
  caddy-config:
