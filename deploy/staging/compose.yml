# Environnement de staging : tout TimeSheet sur un seul serveur Linux.
# Application (API .NET qui sert aussi l'interface), PostgreSQL, HTTPS (Caddy) et tâches
# planifiées. Guide : docs/staging.md. Les valeurs viennent de deploy/staging/.env
# (modèle : .env.example, à côté).
name: timesheet-staging

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: timesheet
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet -d timesheet"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Image de deploy/Dockerfile. Les migrations s'appliquent au démarrage. Commandes de mise
  # en service (docs/staging.md) : docker compose run --rm app --admin-plateforme …
  app:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: timesheet:staging
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TimeSheetApi__ConnectionStrings__TimeSheetApi: Host=db;Port=5432;Database=timesheet;Username=timesheet;Password=${POSTGRES_PASSWORD:?}
      APP_URL: https://${DOMAIN:?}
      STORAGE_DIR: /app/storage
    volumes:
      # PDF signés et clés des sessions : à sauvegarder avec la base.
      - app-data:/app/storage
    depends_on:
      db:
        condition: service_healthy

  # HTTPS : certificat Let's Encrypt obtenu et renouvelé tout seul pour DOMAIN.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Tâches planifiées (docs/exploitation.md) : relances et rappels de saisie.
  taches:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      TASKS_SECRET: ${TASKS_SECRET:?}
    volumes:
      - ./taches.crontab:/etc/crontabs/root:ro
    command: ["crond", "-f", "-l", "6"]
    depends_on:
      - app

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:
